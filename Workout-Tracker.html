<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Performance Tracker</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #0A0C0F;
  --surface: #0F1117;
  --border: #1E2128;
  --text: #E0E0E0;
  --muted: #AAA;
  --dim: #777;
  --accent: #F07820;
  --green: #2EAF7D;
  --red: #C04040;
  --blue: #3A7FD5;
}
body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Courier New', Courier, monospace;
  font-size: 15px;
  min-height: 100vh;
  padding-bottom: 60px;
}
.header {
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  padding: 12px 16px 0;
  position: sticky;
  top: 0;
  z-index: 100;
}
.header-top {
  display: -webkit-box;
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 10px;
}
.header-title { font-size: 11px; letter-spacing: 4px; color: var(--muted); }
.week-info { font-size: 11px; color: var(--dim); }
.block-bar {
  padding: 8px 12px;
  margin-bottom: 8px;
  border-left: 3px solid var(--accent);
  background: rgba(240,120,32,0.06);
  display: -webkit-box;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
}
.block-name { font-size: 12px; font-weight: bold; letter-spacing: 2px; color: var(--accent); }
.block-info { font-size: 11px; color: var(--dim); }
.block-btn {
  background: transparent;
  border: 1px solid var(--border);
  color: var(--dim);
  padding: 4px 10px;
  font-family: inherit;
  font-size: 10px;
  cursor: pointer;
  letter-spacing: 1px;
}
.ready-banner {
  padding: 10px 12px;
  margin-bottom: 6px;
  border-left: 3px solid var(--green);
  background: rgba(46,175,125,0.08);
  display: -webkit-box;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
}
.ready-title { font-size: 11px; font-weight: bold; letter-spacing: 2px; color: var(--green); }
.ready-msg { font-size: 11px; color: var(--muted); margin-top: 2px; }
.advance-btn {
  background: var(--green);
  border: none;
  color: #000;
  padding: 8px 14px;
  font-family: inherit;
  font-size: 11px;
  font-weight: bold;
  cursor: pointer;
  letter-spacing: 1px;
  white-space: nowrap;
}
.day-tabs {
  display: -webkit-box;
  display: flex;
}
.day-tab {
  -webkit-box-flex: 1;
  flex: 1;
  padding: 8px 4px 10px;
  border: none;
  background: transparent;
  color: var(--dim);
  font-family: inherit;
  font-size: 11px;
  letter-spacing: 2px;
  cursor: pointer;
  border-top: 2px solid transparent;
  text-align: center;
}
.day-tab.active { border-top-color: var(--accent); color: var(--accent); background: var(--bg); }
.day-tab-sub { font-size: 9px; margin-top: 2px; }
.sub-tabs {
  display: -webkit-box;
  display: flex;
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
}
.sub-tab {
  padding: 8px 14px;
  border: none;
  background: transparent;
  color: var(--muted);
  font-family: inherit;
  font-size: 10px;
  letter-spacing: 2px;
  cursor: pointer;
  border-bottom: 2px solid transparent;
  white-space: nowrap;
}
.sub-tab.active { color: var(--text); border-bottom-color: var(--accent); }
.content { padding: 14px 16px; max-width: 600px; margin: 0 auto; }
.day-banner {
  border-left: 3px solid var(--accent);
  background: var(--surface);
  padding: 13px 14px;
  margin-bottom: 14px;
  display: -webkit-box;
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
}
.day-banner-left { -webkit-box-flex: 1; flex: 1; }
.day-banner-title { font-size: 16px; font-weight: bold; letter-spacing: 2px; color: var(--accent); }
.day-banner-sub { font-size: 12px; color: var(--muted); margin-top: 5px; line-height: 1.5; }
.day-banner-mod { font-size: 11px; margin-top: 4px; }
.day-vol-num { font-size: 20px; font-weight: bold; color: var(--accent); text-align: right; }
.day-vol-lbl { font-size: 9px; color: var(--muted); letter-spacing: 1px; text-align: right; }
.ex-card { background: var(--surface); border: 1px solid var(--border); margin-bottom: 10px; }
.ex-header {
  display: -webkit-box;
  display: flex;
  align-items: center;
  padding: 13px 14px;
  cursor: pointer;
  gap: 8px;
}
.ex-num {
  width: 22px; height: 22px;
  display: -webkit-box;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 10px;
  font-weight: bold;
  border: 1px solid;
  flex-shrink: 0;
}
.ex-name { font-size: 13px; -webkit-box-flex: 1; flex: 1; color: #CCC; }
.ex-meta {
  display: -webkit-box;
  display: flex;
  align-items: center;
  gap: 8px;
  flex-shrink: 0;
}
.ex-vol { font-size: 11px; }
.ex-arrow { font-size: 10px; color: var(--dim); }
.flag {
  font-size: 9px;
  padding: 2px 6px;
  letter-spacing: 1px;
  font-weight: bold;
  border: 1px solid;
}
.sets-area {
  padding: 10px 14px 14px;
  border-top: 1px solid var(--border);
}
.target-badge {
  padding: 7px 10px;
  margin-bottom: 10px;
  border-left: 2px solid;
  display: -webkit-box;
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}
.target-type { font-size: 10px; letter-spacing: 1px; }
.target-reps { font-size: 13px; font-weight: bold; }
.target-pct { font-size: 11px; color: var(--dim); }
.sets-hdr {
  display: -webkit-box;
  display: flex;
  gap: 6px;
  font-size: 9px;
  letter-spacing: 2px;
  color: var(--muted);
  margin-bottom: 6px;
}
.set-row {
  display: -webkit-box;
  display: flex;
  gap: 6px;
  margin-bottom: 6px;
  align-items: center;
}
.set-num { font-size: 10px; color: var(--muted); text-align: center; width: 20px; flex-shrink: 0; }
input, select {
  background: var(--bg);
  border: 1px solid var(--border);
  color: var(--text);
  padding: 6px 7px;
  font-family: inherit;
  font-size: 12px;
  outline: none;
  -webkit-appearance: none;
  border-radius: 0;
  width: 100%;
}
input:focus, select:focus { border-color: var(--accent); }
.btn-rm-set { background: none; border: none; color: var(--dim); cursor: pointer; font-size: 18px; line-height: 1; padding: 0; width: 22px; flex-shrink: 0; }
.suggestion {
  margin-top: 8px;
  padding: 9px 11px;
  font-size: 12px;
  line-height: 1.5;
  border-left: 2px solid;
}
.ss-row {
  margin-top: 8px;
  display: -webkit-box;
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 11px;
  color: var(--muted);
}
.ss-row select { -webkit-box-flex: 1; flex: 1; }
.ex-actions {
  display: -webkit-box;
  display: flex;
  gap: 8px;
  margin-top: 10px;
  flex-wrap: wrap;
}
.btn-ghost {
  background: transparent;
  border: 1px solid;
  padding: 7px 12px;
  font-family: inherit;
  font-size: 10px;
  letter-spacing: 2px;
  cursor: pointer;
}
.add-ex-btn {
  width: 100%;
  text-align: center;
  padding: 13px;
  margin-top: 10px;
}
.save-btn {
  padding: 13px 28px;
  font-family: inherit;
  font-size: 10px;
  letter-spacing: 3px;
  font-weight: bold;
  cursor: pointer;
  border: none;
  background: var(--accent);
  color: #000;
  margin-top: 16px;
}
.notes-wrap { margin-top: 14px; }
.notes-lbl { font-size: 10px; letter-spacing: 3px; color: var(--muted); margin-bottom: 6px; }
textarea {
  width: 100%;
  background: var(--bg);
  border: 1px solid var(--border);
  color: var(--text);
  padding: 9px 11px;
  font-family: inherit;
  font-size: 12px;
  min-height: 65px;
  resize: vertical;
  outline: none;
  border-radius: 0;
}
textarea:focus { border-color: var(--accent); }
.guide-box { margin-top: 18px; padding: 13px 14px; background: var(--surface); border: 1px solid var(--border); }
.guide-title { font-size: 9px; letter-spacing: 3px; color: var(--muted); margin-bottom: 11px; }
.guide-row { display: -webkit-box; display: flex; gap: 10px; margin-bottom: 8px; font-size: 11px; }
.guide-term { color: var(--accent); min-width: 120px; flex-shrink: 0; }
.guide-def { color: var(--muted); line-height: 1.5; }
.calc-wrap { background: var(--surface); border: 1px solid var(--border); margin-top: 16px; }
.calc-hdr {
  padding: 12px 14px;
  border-bottom: 1px solid var(--border);
  display: -webkit-box;
  display: flex;
  justify-content: space-between;
  align-items: center;
  cursor: pointer;
}
.calc-title-txt { font-size: 10px; letter-spacing: 3px; color: var(--muted); }
.calc-body { padding: 13px 14px; }
.calc-section-lbl { font-size: 9px; letter-spacing: 3px; color: var(--muted); margin-bottom: 8px; }
.calc-row { display: -webkit-box; display: flex; align-items: center; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
.calc-lbl { font-size: 12px; color: var(--muted); min-width: 120px; }
.calc-tm { font-size: 13px; font-weight: bold; }
.wave-btns { display: -webkit-box; display: flex; gap: 5px; flex-wrap: wrap; margin-bottom: 8px; }
.week-btns { display: -webkit-box; display: flex; gap: 5px; flex-wrap: wrap; margin-bottom: 12px; }
.wave-btn, .week-btn {
  background: transparent;
  border: 1px solid var(--border);
  color: var(--muted);
  padding: 5px 10px;
  font-family: inherit;
  font-size: 10px;
  cursor: pointer;
  letter-spacing: 1px;
}
.phase-note {
  padding: 9px 11px;
  margin-bottom: 12px;
  border-left: 2px solid var(--accent);
  font-size: 11px;
  color: var(--muted);
  line-height: 1.5;
}
.phase-label { font-size: 10px; letter-spacing: 2px; margin-bottom: 3px; }
.wave-tbl { width: 100%; border-collapse: collapse; margin-bottom: 12px; font-size: 12px; }
.wave-tbl th { font-size: 9px; letter-spacing: 2px; color: var(--muted); padding: 5px 8px; text-align: center; border-bottom: 1px solid var(--border); font-weight: normal; }
.wave-tbl td { padding: 7px 8px; text-align: center; border-bottom: 1px solid var(--border); }
.wave-tbl tr:last-child td { border-bottom: none; }
.wave-tbl .td-lbl { text-align: left; color: var(--muted); font-size: 11px; }
.wave-tbl .td-warmup { color: var(--dim); }
.td-top { font-weight: bold; }
.amrap-box {
  padding: 11px 12px;
  margin-top: 10px;
  border: 1px solid;
  background: rgba(46,175,125,0.06);
}
.amrap-lbl { font-size: 9px; letter-spacing: 2px; margin-bottom: 8px; }
.amrap-row { display: -webkit-box; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.amrap-result { margin-top: 8px; font-size: 12px; color: var(--muted); }
.bump-flag {
  margin-top: 10px;
  padding: 9px 11px;
  border-left: 2px solid var(--green);
  background: rgba(46,175,125,0.06);
  font-size: 12px;
  color: #A0DFC0;
  display: none;
}
.est-wrap { margin-top: 13px; padding-top: 13px; border-top: 1px solid var(--border); }
.est-row { display: -webkit-box; display: flex; gap: 8px; align-items: center; margin-bottom: 8px; }
.est-result { font-size: 12px; color: var(--muted); margin-bottom: 8px; min-height: 18px; }
.hist-entry { background: var(--surface); border: 1px solid var(--border); padding: 13px 14px; margin-bottom: 10px; }
.hist-week { display: -webkit-box; display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 8px; }
.hist-wk-lbl { font-size: 11px; letter-spacing: 2px; color: var(--dim); }
.hist-vol { font-size: 13px; font-weight: bold; }
.hist-block-tag { font-size: 10px; padding: 1px 6px; border: 1px solid; margin-left: 6px; }
.hist-ex-name { font-size: 11px; color: var(--muted); margin-bottom: 4px; letter-spacing: 1px; }
.chips { display: -webkit-box; display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 6px; }
.chip { font-size: 10px; padding: 2px 7px; border: 1px solid; }
.hist-note { font-size: 11px; color: var(--muted); font-style: italic; padding: 5px 8px; border-left: 2px solid var(--border); margin-bottom: 8px; }
.chart-box { background: var(--surface); border: 1px solid var(--border); padding: 14px; margin-bottom: 14px; }
.prog-bar-wrap { margin-bottom: 11px; }
.prog-bar-hdr { display: -webkit-box; display: flex; justify-content: space-between; font-size: 11px; margin-bottom: 4px; }
.prog-bar-bg { height: 3px; background: var(--border); }
.prog-bar-fill { height: 100%; }
.stag-tbl { background: var(--surface); border: 1px solid var(--border); padding: 13px 14px; margin-bottom: 14px; }
.stag-row { display: -webkit-box; display: flex; gap: 8px; padding: 7px 0; border-bottom: 1px solid var(--border); align-items: flex-start; }
.stag-row:last-child { border-bottom: none; }
.stag-name { -webkit-box-flex: 1; flex: 1; font-size: 12px; color: #AAA; }
.stag-status { min-width: 70px; font-size: 10px; letter-spacing: 1px; }
.stag-action { min-width: 120px; font-size: 10px; color: var(--muted); line-height: 1.4; }
.info-box { padding: 12px 14px; background: var(--surface); border: 1px solid var(--border); font-size: 12px; color: var(--muted); line-height: 1.7; margin-bottom: 12px; }
.block-card { background: var(--surface); border: 1px solid var(--border); margin-bottom: 12px; }
.block-card-hdr { padding: 13px 14px; border-bottom: 1px solid var(--border); display: -webkit-box; display: flex; justify-content: space-between; align-items: center; }
.block-card-title { font-size: 14px; font-weight: bold; letter-spacing: 2px; }
.block-card-sub { font-size: 11px; color: var(--muted); margin-top: 3px; }
.block-day-row { display: -webkit-box; display: flex; gap: 8px; padding: 8px 14px; border-bottom: 1px solid var(--border); font-size: 12px; }
.block-day-row:last-child { border-bottom: none; }
.block-day-lbl { min-width: 80px; font-size: 10px; letter-spacing: 1px; padding-top: 1px; }
.block-day-detail { -webkit-box-flex: 1; flex: 1; line-height: 1.5; }
.block-day-note { font-size: 11px; color: var(--muted); margin-top: 2px; }
.block-main-note { padding: 10px 14px; border-bottom: 1px solid var(--border); }
.block-main-mod { font-size: 10px; letter-spacing: 2px; margin-bottom: 4px; }
.block-main-desc { font-size: 11px; color: var(--muted); line-height: 1.5; }
.defaults-item { display: -webkit-box; display: flex; align-items: center; justify-content: space-between; padding: 11px 14px; border-bottom: 1px solid var(--border); gap: 10px; }
.defaults-item:last-child { border-bottom: none; }
.defaults-name { font-size: 13px; color: #CCC; -webkit-box-flex: 1; flex: 1; }
.toggle { position: relative; width: 40px; height: 22px; flex-shrink: 0; }
.toggle input { opacity: 0; width: 0; height: 0; position: absolute; }
.toggle-slider { position: absolute; inset: 0; background: var(--border); cursor: pointer; border-radius: 22px; }
.toggle-slider:before { content: ""; position: absolute; height: 16px; width: 16px; left: 3px; bottom: 3px; background: var(--muted); border-radius: 50%; }
.empty { text-align: center; padding: 40px 20px; color: var(--dim); font-size: 12px; letter-spacing: 2px; line-height: 2; }
.modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 200; display: -webkit-box; display: flex; align-items: flex-end; }
.modal { background: var(--surface); border-top: 1px solid var(--border); width: 100%; max-height: 75vh; display: -webkit-box; display: flex; -webkit-box-orient: vertical; flex-direction: column; }
.modal-hdr { padding: 14px 16px 12px; border-bottom: 1px solid var(--border); display: -webkit-box; display: flex; justify-content: space-between; align-items: center; flex-shrink: 0; }
.modal-title { font-size: 12px; letter-spacing: 3px; color: var(--accent); }
.modal-close { background: none; border: none; color: var(--muted); font-size: 22px; cursor: pointer; padding: 0; line-height: 1; }
.modal-search { padding: 10px 14px; border-bottom: 1px solid var(--border); flex-shrink: 0; }
.modal-list { overflow-y: auto; -webkit-overflow-scrolling: touch; -webkit-box-flex: 1; flex: 1; }
.modal-item { display: -webkit-box; display: flex; align-items: center; justify-content: space-between; padding: 13px 16px; border-bottom: 1px solid var(--border); cursor: pointer; gap: 10px; }
.modal-item-name { font-size: 13px; color: var(--text); -webkit-box-flex: 1; flex: 1; }
.modal-new { padding: 13px 14px; border-top: 1px solid var(--border); display: -webkit-box; display: flex; gap: 8px; flex-shrink: 0; }
.modal-new input { -webkit-box-flex: 1; flex: 1; }
.export-box { background: var(--surface); border: 1px solid var(--border); padding: 13px 14px; margin-top: 14px; }
</style>
</head>
<body>

<div class="header">
  <div class="header-top">
    <span class="header-title">PERFORMANCE LOG</span>
    <span class="week-info" id="weekInfo"></span>
  </div>
  <div id="blockArea"></div>
  <div class="day-tabs" id="dayTabs"></div>
  <div class="sub-tabs" id="subTabs"></div>
</div>
<div class="content" id="content"></div>

<div class="modal-overlay" id="libModal" style="display:none" onclick="closeLibIfOut(event)">
  <div class="modal">
    <div class="modal-hdr">
      <span class="modal-title">EXERCISE LIBRARY</span>
      <button class="modal-close" onclick="closeLib()">x</button>
    </div>
    <div class="modal-search">
      <input type="text" id="libSearch" placeholder="Search exercises..." oninput="filterLib()">
    </div>
    <div class="modal-list" id="libList"></div>
    <div class="modal-new">
      <input type="text" id="libNew" placeholder="Add new exercise...">
      <button class="btn-ghost" style="color:var(--accent);border-color:var(--accent)" onclick="addNewEx()">ADD</button>
    </div>
  </div>
</div>

<script type="text/javascript">
// ── Data ──────────────────────────────────────────────────────────────────

var DAYS = [
  { id:"monday",   label:"MON", full:"Monday",   focus:"CHEST",     color:"#F07820" },
  { id:"tuesday",  label:"TUE", full:"Tuesday",  focus:"BACK",      color:"#3A7FD5" },
  { id:"thursday", label:"THU", full:"Thursday", focus:"SHOULDERS", color:"#2EAF7D" },
  { id:"friday",   label:"FRI", full:"Friday",   focus:"LEGS",      color:"#C45C8A" }
];

var BLOCKS = [
  { id:"hyp", name:"HYPERTROPHY", weeks:"Waves 1-2 (10s & 8s)", shortName:"HYP", color:"#3A7FD5",
    desc:"Build muscle base and work capacity",
    mainMod:"WAVE 1-2 · 10s then 8s · 3s eccentric",
    mainNote:"3s eccentric on all main lift sets. Accessory compounds 3x10-12. Isolation always 3x12-15.",
    days:{
      monday:   { sets:"3", reps:"10-12", pct:"60-65%", rest:"60-90s", note:"3s eccentric on all pressing — tempo drives hypertrophy", flavor:"Volume" },
      tuesday:  { sets:"3", reps:"10-12", pct:"60-65%", rest:"60-90s", note:"Chest-supported rows preferred — full stretch", flavor:"Volume" },
      thursday: { sets:"3", reps:"10-12", pct:"60-65%", rest:"60s",    note:"Strict form — slow eccentric on laterals", flavor:"Volume" },
      friday:   { sets:"3", reps:"10-15", pct:"60-65%", rest:"60-75s", note:"Unilateral focus — golf hip stability", flavor:"Volume" }
    }
  },
  { id:"str", name:"STRENGTH", weeks:"Wave 3 (5s)", shortName:"STR", color:"#E05C48",
    desc:"Convert hypertrophy gains to strength",
    mainMod:"WAVE 3 · 5s · Push AMRAP",
    mainNote:"Push AMRAP hard on realization week — this sets your next TM. Compound accessories 4x5-7.",
    days:{
      monday:   { sets:"4", reps:"5-7", pct:"75-80%", rest:"2-3 min", note:"Heavier compound accessories — dips and incline near max", flavor:"Intensity" },
      tuesday:  { sets:"4", reps:"5-7", pct:"75-80%", rest:"2-3 min", note:"Heavy compound pulling — rows and pull-ups loaded", flavor:"Intensity" },
      thursday: { sets:"4", reps:"5-7", pct:"72-78%", rest:"2 min",   note:"Strict pressing only — no leg drive on overhead", flavor:"Intensity" },
      friday:   { sets:"4", reps:"5-7", pct:"75-80%", rest:"2-3 min", note:"Heavy bilateral and unilateral leg work", flavor:"Intensity" }
    }
  },
  { id:"pwr", name:"POWER & ATHLETIC", weeks:"Wave 4 (3s)", shortName:"PWR", color:"#2EAF7D",
    desc:"Peak athletic output and golf performance",
    mainMod:"WAVE 4 · 3s · Explosive intent",
    mainNote:"Max explosive concentric intent every rep. AMRAP on realization week peaks the full cycle.",
    days:{
      monday:   { sets:"4", reps:"3-5", pct:"75-80%", rest:"2 min",   note:"EXPLOSIVE concentric — max intent, reset between reps", flavor:"Power" },
      tuesday:  { sets:"4", reps:"3-5", pct:"75-80%", rest:"2 min",   note:"Explosive rows and pulls — fast concentric", flavor:"Power" },
      thursday: { sets:"4", reps:"3-5", pct:"72-78%", rest:"90s",     note:"Contrast pairs — heavy compound then rotational", flavor:"Contrast" },
      friday:   { sets:"4", reps:"3-5", pct:"75-80%", rest:"90s",     note:"Contrast pairs — squat or RDL then jump", flavor:"Contrast" }
    }
  },
  { id:"dld", name:"DELOAD", weeks:"Wave deload week", shortName:"DLD", color:"#777",
    desc:"Consolidate all adaptations",
    mainMod:"DELOAD · 40-50% · No grinding",

// ── Storage ───────────────────────────────────────────────────────────────

function loadData() {
  try { return JSON.parse(localStorage.getItem("pt6") || "{}"); } catch(e) { return {}; }
}
function saveData(d) {
  try { localStorage.setItem("pt6", JSON.stringify(d)); } catch(e) {}
}

function getDefaults(dayId) {
  var d = loadData();
  if (d.defaults && d.defaults[dayId]) return d.defaults[dayId];
  return SEED_EX[dayId].map(function(n) { return { name:n, isDefault:true }; });
}
function setDefaults(dayId, arr) {
  var d = loadData();
  if (!d.defaults) d.defaults = {};
  d.defaults[dayId] = arr;
  saveData(d);
}

function getLibrary() {
  var d = loadData();
  if (d.library) return d.library;
  var all = {};
  DAYS.forEach(function(day) {
    SEED_EX[day.id].forEach(function(n) { all[n] = 1; });
  });
  EXTRA_LIB.forEach(function(n) { all[n] = 1; });
  return Object.keys(all).map(function(n) { return { name:n }; });
}
function addToLibrary(name) {
  var d = loadData();
  if (!d.library) d.library = getLibrary();
  var exists = d.library.some(function(e) { return e.name.toLowerCase() === name.toLowerCase(); });
  if (!exists) d.library.push({ name:name });
  saveData(d);
}
function getLibNames() {
  return getLibrary().map(function(e) { return e.name; });
}

function getSession(wk, dayId) {
  var d = loadData();
  if (d.sessions && d.sessions[wk] && d.sessions[wk][dayId]) return d.sessions[wk][dayId];
  return getDefaults(dayId).filter(function(e) { return e.isDefault; }).map(function(e) {
    return { id:uid(), name:e.name, supersetWith:null, sets:[{ id:uid(), weight:"", reps:"", technique:"Standard", notes:"" }] };
  });
}
function saveSession(wk, dayId, exs) {
  var d = loadData();
  if (!d.sessions) d.sessions = {};
  if (!d.sessions[wk]) d.sessions[wk] = {};
  d.sessions[wk][dayId] = exs;
  if (!d.history) d.history = {};
  if (!d.history[wk]) d.history[wk] = { weekKey:wk, block:getCurrentBlock(), days:{} };
  d.history[wk].days[dayId] = { exercises:exs, block:getCurrentBlock(), savedAt:new Date().toISOString() };
  saveData(d);
}
function getHistory(dayId) {
  var d = loadData();
  if (!d.history) return [];
  return Object.keys(d.history).map(function(k) { return d.history[k]; })
    .filter(function(w) { return w.days && w.days[dayId]; })
    .sort(function(a,b) { return a.weekKey < b.weekKey ? -1 : 1; });
}

function getCurrentBlock() { var d=loadData(); return d.currentBlock||"hyp"; }
function setCurrentBlock(id) { var d=loadData(); d.currentBlock=id; saveData(d); }
function getBlockSessions(blockId) {
  var d=loadData(); if (!d.history) return 0;
  var count=0;
  Object.keys(d.history).forEach(function(k) {
    var w=d.history[k];
    if (DAYS.some(function(day) { return w.days && w.days[day.id] && w.days[day.id].block===blockId; })) count++;
  });
  return count;
}

function getCalc() { var d=loadData(); return d.calc||{}; }
function saveCalc(c) { var d=loadData(); d.calc=c; saveData(d); }
function getTM(liftId) { var c=getCalc(); return (c[liftId]&&c[liftId].tm)||0; }
function getJugWaveId() { var d=loadData(); return d.jugWave||"10s"; }
function getJugWeekNum() { var d=loadData(); return d.jugWeek||1; }
function setJugPosition(waveId, weekNum) {
  var d=loadData(); d.jugWave=waveId; d.jugWeek=weekNum||1; saveData(d);
}
function getJugWaveObj() {
  var id=getJugWaveId();
  for (var i=0;i<JUG_WAVES.length;i++) { if (JUG_WAVES[i].id===id) return JUG_WAVES[i]; }
  return JUG_WAVES[0];
}
function getJugWeekObj() {
  var wave=getJugWaveObj(), num=getJugWeekNum();
  for (var i=0;i<wave.weeks.length;i++) { if (wave.weeks[i].week===num) return wave.weeks[i]; }
  return wave.weeks[0];
}

// ── Utilities ─────────────────────────────────────────────────────────────

function uid() { return Math.random().toString(36).slice(2,8); }

function getWeekKey() {
  var n=new Date(), d=new Date(Date.UTC(n.getFullYear(),n.getMonth(),n.getDate()));
  d.setUTCDate(d.getUTCDate()+4-(d.getUTCDay()||7));
  var y=new Date(Date.UTC(d.getUTCFullYear(),0,1));
  var wk=Math.ceil((((d-y)/86400000)+1)/7);
  return d.getUTCFullYear()+"-W"+(wk<10?"0"+wk:wk);
}

function r5(n) { return Math.round(n/5)*5; }

function brzycki(w, r) {
  if (r===1) return w;
  if (r>=37) return Math.round(w*1.333);
  return Math.round(w*(36/(37-r)));
}
function calcTM(orm) { return r5(orm*0.9); }

function jugBump(tm, waveId, amrap, upper) {
  var targets={"10s":10,"8s":8,"5s":5,"3s":3};
  var target=targets[waveId]||5;
  var extra=amrap-target;
  if (extra<=0) return 0;
  var perRep=upper?2.5:5;
  var maxBump=upper?10:20;
  return Math.min(r5(extra*perRep), maxBump);
}

function calcVol(sets) {
  var total=0;
  sets.forEach(function(s) {
    var w=parseFloat(s.weight)||0, r=parseFloat(s.reps)||0;
    total+=w*r;
  });
  return total;
}

function dayById(id) {
  for(var i=0;i<DAYS.length;i++) { if(DAYS[i].id===id) return DAYS[i]; }
  return DAYS[0];
}
function blockById(id) {
  for(var i=0;i<BLOCKS.length;i++) { if(BLOCKS[i].id===id) return BLOCKS[i]; }
  return BLOCKS[0];
}

function isIsolationEx(name) {
  var n=name.toLowerCase();
  return ["lateral","curl","face pull","pull-apart","pushdown","band","ab wheel","dead bug","balance","slam ball","pallof","woodchop","rotational","thruster","rollout","floor press"].some(function(k){return n.indexOf(k)>=0;});
}
function isFullBodySingle(name) {
  return name.indexOf("(chest day)")>=0||name.indexOf("(back day)")>=0||name.indexOf("(shoulder day)")>=0||name.indexOf("(leg day)")>=0;
}
function isMainLift(name) {
  return name.indexOf("(Main)")>=0;
}

function getRepTarget(dayId) {
  var block=blockById(getCurrentBlock()), bd=block.days[dayId];
  if (!bd) return {lo:8,hi:12};
  var parts=(bd.reps||"8-12").split("-").map(Number);
  return {lo:parts[0]||8, hi:parts[1]||parts[0]||12};
}

// ── Progression analysis ──────────────────────────────────────────────────

function analyzeEx(name, dayId) {
  var hist=getHistory(dayId);
  if (hist.length<2) return null;
  var sessions=[];
  hist.forEach(function(w) {
    if (w.days[dayId] && w.days[dayId].exercises) {
      for(var i=0;i<w.days[dayId].exercises.length;i++) {
        if(w.days[dayId].exercises[i].name===name) { sessions.push(w.days[dayId].exercises[i]); break; }
      }
    }
  });
  if (sessions.length<2) return null;
  var repHi=getRepTarget(dayId).hi;
  var vols=sessions.map(function(s){return calcVol(s.sets);});
  var last=sessions[sessions.length-1], prev=sessions[sessions.length-2];
  var lastVol=vols[vols.length-1], prevVol=vols[vols.length-2];
  var recent=vols.slice(-3);
  var avgV=recent.reduce(function(a,b){return a+b;},0)/(recent.length||1);
  var isFlat=recent.length>=3&&avgV>0&&((Math.max.apply(null,recent)-Math.min.apply(null,recent))/avgV)<0.03;
  var hitsTop=last&&last.sets.every(function(s){return (parseFloat(s.reps)||0)>=repHi;});
  var lw=last&&last.sets[0]?(parseFloat(last.sets[0].weight)||0):0;
  var sameFor=0;
  for(var i=sessions.length-1;i>=0;i--) {
    if ((parseFloat(sessions[i].sets[0]&&sessions[i].sets[0].weight)||0)===lw) sameFor++;
    else break;
  }
  if (isFlat&&sessions.length>=3) return {level:"stuck",flag:"PLATEAU",msg:"Volume flat 3+ sessions. Try Rest-Pause or Cluster, or add a set. Same weight for "+sameFor+" sessions."};
  if (hitsTop&&sameFor>=2) {
    var isUp=["Bench","Press","Fly","Row","Pull","Curl","Raise","Lateral","Face"].some(function(k){return name.indexOf(k)>=0;});
    return {level:"up",flag:"PROGRESS",msg:"Hitting top of rep range for 2+ sessions. Add "+(isUp?5:10)+" lbs next session. "+lw+" lbs -> "+(lw+(isUp?5:10))+" lbs."};
  }
  if (lastVol>prevVol&&prevVol>0) return {level:"hold",flag:"ON TRACK",msg:"Volume up "+Math.round(((lastVol-prevVol)/prevVol)*100)+"% from last session. Target: beat "+lastVol.toLocaleString()+" lbs."};
  if (lastVol<prevVol&&lastVol>0&&prevVol>0) return {level:"hold",flag:"BELOW LAST",msg:"Volume dipped. Hold weight, recover reps before adding load."};
  return null;
}

// ── Calculator ────────────────────────────────────────────────────────────

function updateTM(liftId, ormVal) {
  var c=getCalc();
  var orm=parseFloat(ormVal)||0;
  if (!c[liftId]) c[liftId]={};
  c[liftId].orm=orm;
  c[liftId].tm=orm>0?calcTM(orm):0;
  saveCalc(c);
  var el=document.getElementById("tmDisplay_"+liftId);
  if(el) el.textContent="TM: "+(c[liftId].tm>0?c[liftId].tm+" lbs":"--");
}

function logAMRAP(liftId) {
  var el=document.getElementById("amrapInput_"+liftId);
  var reps=parseFloat((el&&el.value)||0);
  if (!reps) return;
  var lift=null;
  MAIN_LIFTS.forEach(function(l){if(l.id===liftId)lift=l;});
  var tm=getTM(liftId);
  var wave=getJugWaveObj();
  var bump=jugBump(tm, wave.id, reps, lift?lift.upper:true);
  var nextTM=tm+bump;
  var c=getCalc();
  if(!c[liftId]) c[liftId]={};
  c[liftId].lastAMRAP=reps;
  c[liftId].nextTM=nextTM;
  c[liftId].readyToBump=bump>0;
  saveCalc(c);
  if(el) el.value="";
  render();
}

function dismissBump(liftId) {
  var c=getCalc();
  if(c[liftId]) c[liftId].readyToBump=false;
  saveCalc(c);
  render();
}

function calcEstimate(liftId) {
  var wEl=document.getElementById("estW_"+liftId), rEl=document.getElementById("estR_"+liftId);
  var w=parseFloat((wEl&&wEl.value)||0), r=parseFloat((rEl&&rEl.value)||0);
  var el=document.getElementById("estResult_"+liftId);
  if(!el) return;
  if(w>0&&r>0) {
    var orm=brzycki(w,r), tm=calcTM(orm);
    el.innerHTML='Estimated 1RM: <b style="color:var(--accent)">'+orm+' lbs</b> &rarr; Suggested TM: <b style="color:var(--accent)">'+tm+' lbs</b>';
  } else {
    el.textContent="Enter a recent heavy set to estimate your 1RM";
  }
}

function applyEstimate(liftId) {
  var wEl=document.getElementById("estW_"+liftId), rEl=document.getElementById("estR_"+liftId);
  var w=parseFloat((wEl&&wEl.value)||0), r=parseFloat((rEl&&rEl.value)||0);
  if(!w||!r) return;
  var orm=brzycki(w,r);
  var c=getCalc();
  if(!c[liftId]) c[liftId]={};
  c[liftId].orm=orm; c[liftId].tm=calcTM(orm);
  saveCalc(c);
  var ormEl=document.getElementById("orm_"+liftId);
  if(ormEl) ormEl.value=orm;
  render();
}

function exportData() {
  var out={exportedAt:new Date().toISOString(),note:"Paste into Claude for analysis",data:loadData()};
  if(navigator.clipboard&&navigator.clipboard.writeText) {
    navigator.clipboard.writeText(JSON.stringify(out,null,2)).then(function(){
      var m=document.getElementById("exportMsg");
      if(m){m.style.display="block";setTimeout(function(){m.style.display="none";},3000);}
    });
  } else {
    var ta=document.createElement("textarea");
    ta.value=JSON.stringify(out,null,2);
    document.body.appendChild(ta); ta.select(); document.execCommand("copy"); document.body.removeChild(ta);
    var m=document.getElementById("exportMsg");
    if(m){m.style.display="block";setTimeout(function(){m.style.display="none";},3000);}
  }
}

function quickAddDefault() {
  var inp=document.getElementById("quickAddInp");
  var name=(inp&&inp.value||"").trim();
  if(!name) return;
  addToLibrary(name);
  var defs=getDefaults(activeDay);
  var found=defs.some(function(d){return d.name===name;});
  if(!found) defs.push({name:name,isDefault:true});
  else defs.forEach(function(d){if(d.name===name)d.isDefault=true;});
  setDefaults(activeDay,defs);
  defFilter="";
  if(inp) inp.value="";
  render();
}

// ── Render helpers ────────────────────────────────────────────────────────

function setAccent(color) {
  document.documentElement.style.setProperty("--accent", color);
}

function colorFor(level) {
  if(level==="up") return "var(--green)";
  if(level==="stuck") return "var(--red)";
  return "#E8A020";
}

function bgFor(color, opacity) {
  // Parse hex and return rgba
  var r=parseInt(color.slice(1,3),16), g=parseInt(color.slice(3,5),16), b=parseInt(color.slice(5,7),16);
  return "rgba("+r+","+g+","+b+","+opacity+")";
}

// ── Main render ───────────────────────────────────────────────────────────

function switchDay(id) { activeDay=id; expandedEx=null; render(); }
function switchTab(t) { activeTab=t; render(); }
function toggleEx(id) { expandedEx=(expandedEx===id)?null:id; render(); }
function advanceBlock() {
  var ids=BLOCKS.map(function(b){return b.id;}), cur=getCurrentBlock();
  var idx=ids.indexOf(cur);
  setCurrentBlock(ids[(idx+1)%ids.length]);
  currentEx={};
  render();
}

function render() {
  try {
    var d=cur(), block=curBlock();
    setAccent(d.color);
    ensureDay(activeDay);

    // Week info
    document.getElementById("weekInfo").textContent=weekKey;

    // Block area
    var blockSessions=getBlockSessions(block.id);
    var blockTarget=block.id==="dld"?4:16;
    var weeksIn=Math.ceil(blockSessions/4)||1;
    var isReady=blockSessions>=blockTarget;
    var isNear=blockSessions>=(blockTarget-4)&&!isReady;
    var nextBlock=BLOCKS[(BLOCKS.indexOf(block)+1)%BLOCKS.length];
    var bHtml="";
    if(isReady) {
      bHtml='<div class="ready-banner" style="border-left-color:'+nextBlock.color+';background:'+bgFor(nextBlock.color,0.08)+'">'
        +'<div><div class="ready-title" style="color:'+nextBlock.color+'">BLOCK COMPLETE</div>'
        +'<div class="ready-msg">'+blockSessions+' sessions logged &mdash; ready to advance to '+nextBlock.name+'</div></div>'
        +'<button class="advance-btn" style="background:'+nextBlock.color+'" onclick="advanceBlock()">ADVANCE &rarr;</button>'
        +'</div>';
    } else if(isNear) {
      bHtml='<div style="padding:8px 12px;margin-bottom:6px;border-left:3px solid '+block.color+';background:'+bgFor(block.color,0.06)+';display:flex;align-items:center;justify-content:space-between">'
        +'<span style="font-size:11px;color:'+block.color+'">'+blockSessions+'/'+blockTarget+' sessions</span>'
        +'<span style="font-size:11px;color:var(--muted)">'+(blockTarget-blockSessions)+' sessions until '+nextBlock.shortName+'</span>'
        +'</div>';
    }
    bHtml+='<div class="block-bar" style="border-left-color:'+block.color+';background:'+bgFor(block.color,0.06)+'">'
      +'<div><div class="block-name" style="color:'+block.color+'">'+block.name+'</div>'
      +'<div class="block-info">'+blockSessions+'/'+blockTarget+' sessions &middot; '+getJugWaveObj().label+' &middot; '+getJugWeekObj().phase+'</div></div>'
      +'<button class="block-btn" onclick="advanceBlock()">&rarr; '+nextBlock.shortName+'</button>'
      +'</div>'
      +'<div style="height:2px;background:var(--border)"><div style="height:100%;width:'+Math.min(Math.round(blockSessions/blockTarget*100),100)+'%;background:'+block.color+'"></div></div>';
    document.getElementById("blockArea").innerHTML=bHtml;

    // Day tabs
    var tabHtml="";
    DAYS.forEach(function(day) {
      var active=day.id===activeDay;
      tabHtml+='<button class="day-tab'+(active?" active":"")+'" '
        +(active?'style="color:'+day.color+';border-top-color:'+day.color+'"':"")+' onclick="switchDay(\''+day.id+'\')">'
        +day.label+'<div class="day-tab-sub">'+day.focus+'</div></button>';
    });
    document.getElementById("dayTabs").innerHTML=tabHtml;

    // Sub tabs
    var subHtml="";
    ["log","history","progress","blocks","defaults"].forEach(function(t) {
      var active=t===activeTab;
      subHtml+='<button class="sub-tab'+(active?" active":"")+'" onclick="switchTab(\''+t+'\')">'+(active?'<b>'+t+'</b>':t)+'</button>';
    });
    document.getElementById("subTabs").innerHTML=subHtml;

    // Day banner
    var bd=block.days[activeDay];
    var exs=currentEx[activeDay];
    var totalVol=exs.reduce(function(s,e){return s+calcVol(e.sets);},0);
    var bannerHtml='<div class="day-banner" style="border-left-color:'+d.color+'">'
      +'<div class="day-banner-left">'
      +'<div class="day-banner-title" style="color:'+d.color+'">'+d.full.toUpperCase()+' &mdash; '+d.focus+'</div>'
      +'<div class="day-banner-sub"><b>'+bd.flavor+'</b> &middot; '+bd.sets+' sets &middot; <b>'+bd.reps+' reps</b> &middot; '+bd.pct+' &middot; Rest '+bd.rest+'<br>'+bd.note+'</div>'
      +'<div class="day-banner-mod" style="color:'+block.color+'">&#9658; '+block.mainMod+'</div>'
      +'</div>'
      +'<div><div class="day-vol-num" id="dayVol" style="color:'+d.color+'">'+(totalVol>0?totalVol.toLocaleString():"&mdash;")+'</div>'
      +'<div class="day-vol-lbl">LBS VOL</div></div>'
      +'</div>';

    var content="";
    if(activeTab==="log") content=renderLog(d,exs,totalVol,block,bd);
    else if(activeTab==="history") content=renderHistory(d);
    else if(activeTab==="progress") content=renderProgress(d,exs,totalVol);
    else if(activeTab==="blocks") content=renderBlocks();
    else if(activeTab==="defaults") content=renderDefaults(d);

    document.getElementById("content").innerHTML=bannerHtml+content;
  } catch(err) {
    document.getElementById("content").innerHTML='<div style="padding:20px;color:#EEE;font-size:13px">'
      +'<div style="color:#E05C48;margin-bottom:10px">Error: '+err.message+'</div>'
      +'<pre style="font-size:10px;color:#888;white-space:pre-wrap">'+(err.stack||"").split("\n").slice(0,5).join("\n")+'</pre></div>';
  }
}

// ── Log tab ───────────────────────────────────────────────────────────────

function renderLog(d, exs, totalVol, block, bd) {
  var html="";
  var jugWave=getJugWaveObj(), jugWeek=getJugWeekObj();

  exs.forEach(function(ex, i) {
    var vol=calcVol(ex.sets);
    var an=analyzeEx(ex.name, activeDay);
    var open=expandedEx===ex.id;
    var isDef=isDefault(ex.name);
    var isMain=isMainLift(ex.name);
    var isIsol=isIsolationEx(ex.name);
    var isFBS=isFullBodySingle(ex.name);

    var flagHtml="";
    if(an) {
      var fc=colorFor(an.level);
      flagHtml='<span class="flag" style="color:'+fc+';border-color:'+fc+'">'+an.flag+'</span>';
    }

    var ssHtml="";
    if(ex.supersetWith) {
      ssHtml='<div style="font-size:11px;color:#B090F0;margin-top:2px">&#8617; SS: '+ex.supersetWith+'</div>';
    }

    html+='<div class="ex-card" id="exc-'+ex.id+'">'
      +'<div class="ex-header" onclick="toggleEx(\''+ex.id+'\')">'
      +'<span class="ex-num" style="color:'+d.color+';border-color:'+d.color+';background:'+bgFor(d.color,0.1)+'">'+(i+1)+'</span>'
      +'<div style="flex:1"><div class="ex-name">'+ex.name+'</div>'+ssHtml+'</div>'
      +'<div class="ex-meta">'
      +(isDef?'<span class="flag" style="color:'+d.color+';border-color:'+d.color+'">&#9733;</span>':"")
      +flagHtml
      +(vol>0?'<span class="ex-vol" style="color:'+d.color+'">'+vol.toLocaleString()+'</span>':"")
      +'<span class="ex-arrow">'+(open?"&#9660;":"&#9658;")+'</span>'
      +'</div></div>';

    if(open) {
      // Target badge
      var displayReps, displaySets, repLabel;
      if(isMain) {
        displayReps=jugWeek.sets+"x"+jugWeek.reps;
        displaySets="";
        repLabel="JUGGERNAUT";
      } else if(isFBS) {
        displayReps="10-12"; displaySets="2"; repLabel="FULL BODY SINGLE";
      } else if(isIsol) {
        displayReps="12-15"; displaySets="3"; repLabel="ISOLATION";
      } else {
        displayReps=bd.reps; displaySets=bd.sets; repLabel="COMPOUND &middot; Wave "+jugWave.id;
      }

      html+='<div class="sets-area">';
      if(an) {
        var sc=colorFor(an.level);
        html+='<div class="suggestion" style="border-left-color:'+sc+';color:'+sc+';background:'+bgFor(sc.replace("var(--","").replace(")","")===sc?sc:"#888",0.08)+'">'
          +'<div style="font-size:9px;letter-spacing:2px;margin-bottom:4px">'+an.flag+'</div>'+an.msg+'</div>';
      }

      html+='<div class="target-badge" style="border-left-color:'+d.color+';background:'+bgFor(d.color,0.06)+'">'
        +'<span class="target-type" style="color:'+d.color+'">'+repLabel+'</span>'
        +(displaySets?'<span class="target-reps" style="color:'+d.color+'">'+displaySets+'x'+displayReps+'</span>':'<span class="target-reps" style="color:'+d.color+'">'+displayReps+'</span>')
        +(isMain?'<span style="font-size:11px;color:var(--dim)">See calculator below</span>':bd.pct?'<span class="target-pct">&middot; '+bd.pct+'</span>':"")
        +'</div>';

      // Set rows
      html+='<div class="sets-hdr" style="padding-left:26px">'
        +'<span style="width:64px">WEIGHT</span><span style="width:54px">REPS</span>'
        +'<span style="width:104px">TECHNIQUE</span><span style="flex:1">NOTES</span><span style="width:22px"></span>'
        +'</div>';

      ex.sets.forEach(function(s, si) {
        var repHi=isFBS?12:isIsol?15:(bd.reps.split("-").map(Number)[1]||12);
        var repLo=isFBS?10:isIsol?12:(bd.reps.split("-").map(Number)[0]||8);
        var actualReps=parseFloat(s.reps)||0;
        var repColor=s.reps?(actualReps>=repHi?"var(--green)":actualReps>=repLo?d.color:"var(--red)"):"var(--text)";

        html+='<div class="set-row">'
          +'<span class="set-num">'+(si+1)+'</span>'
          +'<input type="number" placeholder="lbs" value="'+s.weight+'" style="width:64px" oninput="updateSet(\''+ex.id+'\',\''+s.id+'\',\'weight\',this.value)">'
          +'<input type="number" placeholder="reps" value="'+s.reps+'" style="width:54px;color:'+repColor+'" oninput="updateSet(\''+ex.id+'\',\''+s.id+'\',\'reps\',this.value)">'
          +'<select style="width:104px" onchange="updateSet(\''+ex.id+'\',\''+s.id+'\',\'technique\',this.value)">'
          +TECHNIQUES.map(function(t){return '<option value="'+t+'"'+(s.technique===t?" selected":"")+">"+t+"</option>";}).join("")
          +'</select>'
          +'<input type="text" placeholder="notes..." value="'+s.notes+'" style="flex:1;min-width:0" oninput="updateSet(\''+ex.id+'\',\''+s.id+'\',\'notes\',this.value)">'
          +'<button class="btn-rm-set" onclick="removeSet(\''+ex.id+'\',\''+s.id+'\')">x</button>'
          +'</div>';
      });

      // SS selector
      var otherExs=exs.filter(function(e){return e.id!==ex.id;});
      html+='<div class="ss-row"><span>&#8617; Superset:</span>'
        +'<select onchange="setSS(\''+ex.id+'\',this.value)"><option value="">None</option>'
        +otherExs.map(function(e){return '<option value="'+escq(e.name)+'"'+(ex.supersetWith===e.name?" selected":"")+">"+e.name+"</option>";}).join("")
        +'</select></div>';

      html+='<div class="ex-actions">'
        +'<button class="btn-ghost" style="color:'+d.color+';border-color:'+d.color+'" onclick="addSet(\''+ex.id+'\')">+ SET</button>'
        +'<button class="btn-ghost" style="color:'+(isDef?d.color:"var(--muted)")+';border-color:'+(isDef?d.color:"var(--border)")+'" onclick="toggleDefault(\''+escq(ex.name)+'\','+(isDef?'false':'true')+')">'+(isDef?"&#9733; DEFAULT":"&#9734; SET DEFAULT")+'</button>'
        +'<button class="btn-ghost" style="color:var(--red);border-color:var(--red)" onclick="removeEx(\''+ex.id+'\')">REMOVE</button>'
        +'</div></div>';
    }
    html+='</div>';
  });

  html+='<button class="btn-ghost add-ex-btn" style="color:'+d.color+';border-color:'+d.color+'" onclick="openLib()">+ ADD EXERCISE</button>';

  // Calculator for main lift days
  var lift=null;
  MAIN_LIFTS.forEach(function(l){if(l.day===activeDay)lift=l;});
  if(lift) html+=renderCalc(lift, d);

  // Session notes
  var existingNotes=getSessionNotes(weekKey, activeDay);
  html+='<div class="notes-wrap"><div class="notes-lbl">SESSION NOTES</div>'
    +'<textarea id="sessionNotes" placeholder="Energy level, PRs, how it felt..." oninput="saveSessionNotes(\''+weekKey+'\',\''+activeDay+'\',this.value)">'+existingNotes+'</textarea></div>';

  html+='<div style="display:flex;align-items:center;gap:14px"><button class="save-btn" onclick="doSave()">SAVE SESSION</button>'
    +(totalVol>0?'<span style="font-size:12px;color:var(--muted)">'+totalVol.toLocaleString()+' lbs logged</span>':"")
    +'</div>';

  // Technique guide
  html+='<div class="guide-box"><div class="guide-title">TECHNIQUE GUIDE</div>'
    +[["Tempo","Digits: ecc/pause/con/pause. 3010 = 3s down, 0 pause, 1s up, 0 pause"],
      ["Rest-Pause","Near failure &rarr; rack &rarr; 15-20s &rarr; 2-3 more reps &rarr; repeat once"],
      ["Cluster","4 reps &rarr; 20s rest &rarr; 4 reps &rarr; 20s rest &rarr; 4 reps = 1 set"],
      ["Mech Drop Set","Failure &rarr; easier variation (incline&rarr;flat&rarr;decline). Same weight"],
      ["Contrast","Heavy set &rarr; explosive variation immediately after (squat &rarr; jump)"],
      ["Superset","Non-competing muscles &mdash; one rests while the other works"]
    ].map(function(pair){return '<div class="guide-row"><span class="guide-term">'+pair[0]+'</span><span class="guide-def">'+pair[1]+'</span></div>';}).join("")
    +'</div>';

  // Juggernaut glossary
  html+='<div class="guide-box" style="margin-top:10px;border-color:'+bgFor("#3A7FD5",0.4)+'"><div class="guide-title" style="color:#3A7FD5">JUGGERNAUT GLOSSARY</div>'
    +[["TM &mdash; Training Max","Your 1RM x 90% rounded to nearest 5 lbs. All wave percentages calculate from this. The buffer keeps loads honest so you never grind near your true limit in a regular session."],
      ["AMRAP","As Many Reps As Possible. Only on realization week (week 3). Hit the prescribed reps then keep going, leaving 1 rep in reserve. Your rep count sets your next TM."],
      ["Wave","4-week loading cycle targeting a rep range. Wave 1=10s, 2=8s, 3=5s, 4=3s. Each wave has accumulation, intensification, realization, and deload phases."],
      ["3/4/3/2 Sets","Accumulation: 3 sets. Intensification: 4 sets. Realization: 3 sets plus AMRAP. Deload: 2 sets. Sets decrease as weight increases to keep you fresh for the AMRAP."],
      ["TM Bump","Calculated from AMRAP reps. Each extra rep above minimum = +2.5 lbs upper / +5 lbs lower (capped at +10/+20 per wave). Tracker calculator does this automatically."]
    ].map(function(pair){return '<div class="guide-row" style="align-items:flex-start"><span class="guide-term" style="color:#3A7FD5;min-width:130px">'+pair[0]+'</span><span class="guide-def">'+pair[1]+'</span></div>';}).join("")
    +'</div>';

  return html;
}

// ── Calculator ────────────────────────────────────────────────────────────

function renderCalc(lift, d) {
  var tm=getTM(lift.id);
  var calc=getCalc();
  var liftCalc=(calc[lift.id]||{});
  var jugWave=getJugWaveObj(), jugWeek=getJugWeekObj();
  var isDeload=jugWeek.phase==="Deload", isReal=jugWeek.phase==="Realization";

  var html='<div class="calc-wrap"><div class="calc-hdr" onclick="calcOpen=!calcOpen;render()">'
    +'<span class="calc-title-txt">JUGGERNAUT &mdash; '+lift.label.toUpperCase()+'</span>'
    +'<span style="color:var(--dim);font-size:12px">'+(calcOpen?"&#9650; HIDE":"&#9660; SHOW")+'</span>'
    +'</div>';

  if(calcOpen) {
    html+='<div class="calc-body">';

    // TM setup
    html+='<div class="calc-section-lbl">TRAINING MAX</div>'
      +'<div class="calc-row"><span class="calc-lbl">'+lift.label+'</span>'
      +'<input type="number" id="orm_'+lift.id+'" placeholder="True 1RM (lbs)" value="'+(liftCalc.orm||"")
      +'" style="max-width:130px" oninput="updateTM(\''+lift.id+'\',this.value)">'
      +'<span class="calc-tm" id="tmDisplay_'+lift.id+'" style="color:'+d.color+'">TM: '+(tm>0?tm+" lbs":"--")+'</span></div>'
      +'<div style="font-size:11px;color:var(--dim);margin-bottom:14px">TM = 1RM x 90% &middot; Brzycki formula &middot; Nearest 5 lbs</div>';

    // Wave selector
    html+='<div class="calc-section-lbl">WAVE</div><div class="wave-btns">';
    JUG_WAVES.forEach(function(w) {
      var active=jugWave.id===w.id;
      html+='<button class="wave-btn" style="background:'+(active?w.color:"transparent")+';color:'+(active?"#000":w.color)+';border-color:'+w.color+'" onclick="setJugPosition(\''+w.id+'\',1);render()">'+w.label+'</button>';
    });
    html+='</div>';

    // Week selector
    html+='<div class="week-btns">';
    jugWave.weeks.forEach(function(w) {
      var active=jugWeek.week===w.week;
      html+='<button class="week-btn" style="background:'+(active?jugWave.color:"transparent")+';color:'+(active?"#000":"var(--muted)")+';border-color:'+(active?jugWave.color:"var(--border)")+'" onclick="setJugPosition(\''+jugWave.id+'\','+w.week+');render()">Wk'+w.week+' '+w.phase+'</button>';
    });
    html+='</div>';

    // Phase note
    html+='<div class="phase-note" style="border-left-color:'+jugWave.color+';background:'+bgFor(jugWave.color,0.06)+'">'
      +'<div class="phase-label" style="color:'+jugWave.color+'">'+jugWeek.phase.toUpperCase()+' &mdash; '+jugWave.label.toUpperCase()+'</div>'
      +jugWeek.note+'</div>';

    if(tm>0) {
      // Working sets table
      html+='<table class="wave-tbl"><thead><tr>'
        +'<th style="text-align:left">SET</th><th>%</th><th>WEIGHT</th><th>REPS</th>'
        +'</tr></thead><tbody>';

      // Warmups
      html+='<tr><td colspan="4" style="padding:4px 8px;font-size:9px;letter-spacing:2px;color:var(--dim)">WARMUP</td></tr>';
      [[0.40,"5"],[0.50,"5"],[0.60,"3"]].forEach(function(w) {
        html+='<tr><td class="td-lbl td-warmup">Warmup</td><td class="td-warmup">'+Math.round(w[0]*100)+'%</td><td class="td-warmup">'+r5(tm*w[0])+' lbs</td><td class="td-warmup">'+w[1]+'</td></tr>';
      });

      // Working sets
      html+='<tr><td colspan="4" style="padding:4px 8px;font-size:9px;letter-spacing:2px;color:var(--muted)">'+jugWeek.sets+' WORKING SETS &mdash; '+jugWeek.reps+' REPS</td></tr>';
      for(var i=0;i<jugWeek.sets;i++) {
        var isTop=(i===jugWeek.sets-1)&&isReal;
        html+='<tr'+(isTop?' style="background:'+bgFor(jugWave.color,0.1)+'"':"")+'>'+
          '<td class="td-lbl'+(isTop?' td-top':"")+'">'+'Set '+(i+1)+(isTop?' (AMRAP)':'')+'</td>'
          +'<td class="'+(isTop?'td-top':"")+'" style="'+(isTop?'color:'+jugWave.color:"")+'">'+(Math.round(jugWeek.pct*100))+'%</td>'
          +'<td class="'+(isTop?'td-top':"")+'" style="'+(isTop?'color:'+jugWave.color:"")+'">'+(r5(tm*jugWeek.pct))+' lbs</td>'
          +'<td class="'+(isTop?'td-top':"")+'" style="'+(isTop?'color:'+jugWave.color:"")+'">'+(jugWeek.reps)+'</td>'
          +'</tr>';
      }
      html+='</tbody></table>';

      // AMRAP logger (realization week only)
      if(isReal) {
        html+='<div class="amrap-box" style="border-color:'+jugWave.color+';background:'+bgFor(jugWave.color,0.06)+'">'
          +'<div class="amrap-lbl" style="color:'+jugWave.color+'">LOG AMRAP &mdash; SETS YOUR NEXT TM</div>'
          +'<div class="amrap-row">'
          +'<input type="number" id="amrapInput_'+lift.id+'" placeholder="Reps achieved..." style="max-width:160px">'
          +'<button class="btn-ghost" style="color:'+jugWave.color+';border-color:'+jugWave.color+'" onclick="logAMRAP(\''+lift.id+'\')">CALCULATE</button>'
          +'</div>'
          +'<div class="amrap-result">'+(liftCalc.lastAMRAP?'Last AMRAP: '+liftCalc.lastAMRAP+' reps &rarr; Next TM: <b style="color:'+jugWave.color+'">'+liftCalc.nextTM+' lbs</b>':"Enter reps to calculate your next TM")+'</div>'
          +'</div>';
      }

      // Bump flag
      if(liftCalc.readyToBump) {
        html+='<div class="bump-flag" style="display:block">'
          +'&#8679; AMRAP logged &mdash; suggested TM: <b>'+liftCalc.nextTM+' lbs</b><br>'
          +'<span style="color:var(--muted)">Update your 1RM above after deload week.</span> '
          +'<button onclick="dismissBump(\''+lift.id+'\')" style="background:none;border:1px solid var(--green);color:var(--green);padding:3px 10px;font-family:inherit;font-size:10px;cursor:pointer;margin-top:6px">GOT IT</button>'
          +'</div>';
      }
    } else {
      html+='<div style="font-size:13px;color:var(--dim);padding:14px 0;text-align:center">Enter your 1RM above to see working weights</div>';
    }

    // Estimator
    html+='<div class="est-wrap"><div class="calc-section-lbl">1RM ESTIMATOR (BRZYCKI)</div>'
      +'<div class="est-row">'
      +'<input type="number" id="estW_'+lift.id+'" placeholder="Weight (lbs)" oninput="calcEstimate(\''+lift.id+'\')">'
      +'<span style="color:var(--dim)">x</span>'
      +'<input type="number" id="estR_'+lift.id+'" placeholder="Reps" oninput="calcEstimate(\''+lift.id+'\')">'
      +'</div>'
      +'<div class="est-result" id="estResult_'+lift.id+'">Enter a recent heavy set to estimate your 1RM</div>'
      +'<button class="btn-ghost" style="color:var(--muted);border-color:var(--border)" onclick="applyEstimate(\''+lift.id+'\')">USE ESTIMATED 1RM</button>'
      +'</div>';

    html+='</div>';
  }
  html+='</div>';
  return html;
}

// ── History tab ───────────────────────────────────────────────────────────

function renderHistory(d) {
  var hist=getHistory(activeDay);
  if(!hist.length) return '<div class="empty">NO SESSIONS LOGGED YET<br><br>Save your first session<br>to start building history</div>';
  var html="";
  var reversed=hist.slice().reverse();
  reversed.forEach(function(w) {
    var exs=w.days[activeDay].exercises;
    var vol=exs.reduce(function(s,e){return s+calcVol(e.sets);},0);
    var block=blockById(w.days[activeDay].block||"hyp");
    var note=getSessionNotes(w.weekKey, activeDay);
    html+='<div class="hist-entry">'
      +'<div class="hist-week">'
      +'<span class="hist-wk-lbl">'+w.weekKey+' <span class="hist-block-tag" style="color:'+block.color+';border-color:'+block.color+'">'+block.shortName+'</span></span>'
      +'<span class="hist-vol" style="color:'+d.color+'">'+vol.toLocaleString()+' lbs</span>'
      +'</div>';
    if(note) html+='<div class="hist-note">'+note+'</div>';
    exs.forEach(function(ex) {
      var done=ex.sets.filter(function(s){return s.weight&&s.reps;});
      if(!done.length) return;
      html+='<div class="hist-ex-name">'+ex.name+(ex.supersetWith?' &harr; '+ex.supersetWith:"")+'</div>'
        +'<div class="chips">';
      done.forEach(function(s) {
        html+='<span class="chip" style="color:'+d.color+';border-color:'+bgFor(d.color,0.3)+'">'+s.weight+'x'+s.reps+(s.technique!=="Standard"?' ['+s.technique.split(" ")[0]+']':"")+'</span>';
      });
      html+='</div>';
    });
    html+='</div>';
  });
  return html;
}

// ── Progress tab ──────────────────────────────────────────────────────────

function renderProgress(d, exs, totalVol) {
  var hist=getHistory(activeDay);
  var html="";

  // Volume trend
  html+='<div class="chart-box"><div class="guide-title">WEEKLY VOLUME &mdash; '+d.full.toUpperCase()+'</div>';
  if(hist.length<2) {
    html+='<div style="color:var(--dim);font-size:12px;padding:14px 0">Log 2+ sessions to see your trend</div>';
  } else {
    var vols=hist.map(function(w){return w.days[activeDay].exercises.reduce(function(s,e){return s+calcVol(e.sets);},0);});
    var maxV=Math.max.apply(null,vols)||1;
    html+='<div style="display:flex;align-items:flex-end;gap:4px;height:100px;margin-bottom:6px">';
    hist.forEach(function(w,i) {
      var v=vols[i], pct=(v/maxV)*100, isLast=i===hist.length-1;
      var block=blockById((w.days[activeDay].block)||"hyp");
      html+='<div style="flex:1;display:flex;flex-direction:column;align-items:center;height:100%;justify-content:flex-end">'
        +'<div style="font-size:8px;color:'+d.color+';margin-bottom:2px">'+(v>0?(v>=1000?Math.round(v/100)/10+"k":v):"")+'</div>'
        +'<div style="width:100%;min-height:2px;background:'+(isLast?d.color:bgFor(block.color,0.4))+';" class="prog-bar-fill" data-h="'+Math.max(pct,2)+'"></div>'
        +'</div>';
    });
    html+='</div>';
    html+='<div style="display:flex;gap:4px">';
    hist.forEach(function(w){html+='<div style="flex:1;text-align:center;font-size:9px;color:var(--dim)">W'+((w.weekKey.split("-W")[1])||"")+'</div>';});
    html+='</div>';
  }
  html+='</div>';

  // Exercise line chart
  var allNames=[];
  var nameSet={};
  hist.forEach(function(w){
    if(w.days[activeDay]&&w.days[activeDay].exercises) {
      w.days[activeDay].exercises.forEach(function(e){if(!nameSet[e.name]){nameSet[e.name]=1;allNames.push(e.name);}});
    }
  });
  var trackedNames=allNames.filter(function(name){
    return hist.filter(function(w){return w.days[activeDay]&&w.days[activeDay].exercises&&w.days[activeDay].exercises.some(function(e){return e.name===name;});}).length>=2;
  });

  if(!selEx||trackedNames.indexOf(selEx)<0) selEx=trackedNames[0]||null;

  html+='<div class="chart-box">'
    +'<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;flex-wrap:wrap;gap:8px">'
    +'<div class="guide-title" style="margin-bottom:0">EXERCISE TREND</div>'
    +'<div style="display:flex;gap:5px">';
  ["volume","weight","reps"].forEach(function(m) {
    html+='<button onclick="progMetric=\''+m+'\';render()" style="background:'+(progMetric===m?d.color:"transparent")+';color:'+(progMetric===m?"#000":"var(--muted)")+';border:1px solid '+(progMetric===m?d.color:"var(--border)")+';padding:4px 9px;font-family:inherit;font-size:10px;cursor:pointer">'+m.toUpperCase()+'</button>';
  });
  html+='</div></div>';

  if(!trackedNames.length) {
    html+='<div style="color:var(--dim);font-size:12px;padding:12px 0">Log 2+ sessions per exercise to see trends</div>';
  } else {
    html+='<div style="overflow-x:auto;margin-bottom:12px"><div style="display:flex;gap:5px;min-width:max-content">';
    trackedNames.forEach(function(name) {
      var active=selEx===name;
      html+='<button onclick="selEx=\''+escq(name)+'\';render()" style="background:'+(active?bgFor(d.color,0.15):"transparent")+';color:'+(active?d.color:"var(--muted)")+';border:1px solid '+(active?d.color:"var(--border)")+';padding:4px 10px;font-family:inherit;font-size:11px;cursor:pointer;white-space:nowrap">'+name+'</button>';
    });
    html+='</div></div>';

    if(selEx) {
      var sessions=hist.filter(function(w){return w.days[activeDay]&&w.days[activeDay].exercises&&w.days[activeDay].exercises.some(function(e){return e.name===selEx;});});
      var getVal=function(ex) {
        if(progMetric==="volume") return calcVol(ex.sets);
        if(progMetric==="weight") return Math.max.apply(null,ex.sets.map(function(s){return parseFloat(s.weight)||0;}));
        return ex.sets.reduce(function(s,t){return s+(parseFloat(t.reps)||0);},0);
      };
      var sData=sessions.map(function(w) {
        var ex=null;
        w.days[activeDay].exercises.forEach(function(e){if(e.name===selEx)ex=e;});
        return {wk:w.weekKey,val:ex?getVal(ex):0};
      });
      var vals=sData.map(function(s){return s.val;});
      var maxVal=Math.max.apply(null,vals)||1;
      var minVal=0;
      var range=maxVal-minVal||1;
      var first=vals[0], last=vals[vals.length-1];
      var change=last-first;
      var changePct=first>0?Math.round((change/first)*100):0;
      var changeColor=change>0?"var(--green)":change<0?"var(--red)":"var(--muted)";
      var unit=progMetric==="volume"?" lbs":progMetric==="weight"?" lbs":" reps";

      html+='<div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px">'
        +'<span style="font-size:12px;color:var(--muted)">'+progMetric+unit+'</span>'
        +'<span style="font-size:12px;color:'+changeColor+'">'+(change>0?"+":"")+change+unit+' ('+(changePct>0?"+":"")+changePct+'%)</span>'
        +'</div>';

      // SVG line chart
      var W=300, H=80, PAD=6;
      var pts=sData.map(function(s,i) {
        return {
          x:PAD+(i/(sData.length-1||1))*(W-PAD*2),
          y:s.val>0?PAD+(1-((s.val-minVal)/range))*(H-PAD*2):H-PAD,
          v:s.val
        };
      });
      var pathD=pts.map(function(p,i){return (i===0?"M":"L")+p.x.toFixed(1)+","+p.y.toFixed(1);}).join(" ");
      var areaD=pathD+" L"+pts[pts.length-1].x.toFixed(1)+","+H+" L"+pts[0].x.toFixed(1)+","+H+" Z";
      html+='<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;height:80px;overflow:visible">'
        +'<defs><linearGradient id="ag" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="'+d.color+'" stop-opacity="0.2"/><stop offset="100%" stop-color="'+d.color+'" stop-opacity="0"/></linearGradient></defs>'
        +'<path d="'+areaD+'" fill="url(#ag)"/>'
        +'<path d="'+pathD+'" fill="none" stroke="'+d.color+'" stroke-width="2"/>';
      pts.forEach(function(p,i) {
        var isL=i===pts.length-1;
        html+='<circle cx="'+p.x.toFixed(1)+'" cy="'+p.y.toFixed(1)+'" r="'+(isL?5:3)+'" fill="'+(isL?d.color:"var(--bg)")+'" stroke="'+d.color+'" stroke-width="2"/>';
        if(i===0||isL) html+='<text x="'+p.x.toFixed(1)+'" y="'+(p.y-8).toFixed(1)+'" text-anchor="middle" fill="'+(isL?d.color:"var(--muted)")+'" font-size="9" font-family="monospace">'+(progMetric==="volume"&&p.v>=1000?Math.round(p.v/100)/10+"k":p.v)+'</text>';
      });
      html+='</svg>';
      html+='<div style="display:flex;gap:4px;margin-bottom:10px">';
      sData.forEach(function(s){html+='<div style="flex:1;text-align:center;font-size:9px;color:var(--dim)">W'+((s.wk.split("-W")[1])||"")+'</div>';});
      html+='</div>';
      html+='<div style="display:flex;justify-content:space-between;font-size:11px;color:var(--muted)">'
        +'<span>Best: <b style="color:var(--text)">'+Math.max.apply(null,vals)+unit+'</b></span>'
        +'<span>Sessions: <b style="color:var(--text)">'+sessions.length+'</b></span>'
        +'<span>Latest: <b style="color:'+d.color+'">'+vals[vals.length-1]+unit+'</b></span>'
        +'</div>';
    }
  }
  html+='</div>';

  // Progression status
  var report=trackedNames.map(function(name) {
    return {name:name,an:analyzeEx(name,activeDay)};
  });
  if(report.length) {
    html+='<div class="stag-tbl"><div class="guide-title">PROGRESSION STATUS</div>'
      +'<div class="stag-row"><span class="stag-name" style="font-size:10px;letter-spacing:2px;color:var(--muted)">EXERCISE</span><span class="stag-status" style="font-size:10px;letter-spacing:2px;color:var(--muted)">STATUS</span><span class="stag-action" style="font-size:10px;letter-spacing:2px;color:var(--muted)">NEXT ACTION</span></div>';
    report.forEach(function(r) {
      var lvl=r.an?r.an.level:"hold", flag=r.an?r.an.flag:"TRACKING", action=r.an?r.an.msg.split(".")[0]:"Keep logging";
      var col=colorFor(lvl);
      html+='<div class="stag-row" style="cursor:pointer" onclick="selEx=\''+escq(r.name)+'\'">'
        +'<span class="stag-name">'+r.name+'</span>'
        +'<span class="stag-status" style="color:'+col+'">'+flag+'</span>'
        +'<span class="stag-action">'+action+'</span>'
        +'</div>';
    });
    html+='</div>';
  }

  // Session breakdown
  var valid=exs.filter(function(e){return calcVol(e.sets)>0;});
  if(valid.length) {
    html+='<div class="chart-box"><div class="guide-title">TODAY\'S BREAKDOWN</div>';
    valid.forEach(function(ex) {
      var v=calcVol(ex.sets), pct=totalVol>0?Math.round((v/totalVol)*100):0;
      html+='<div class="prog-bar-wrap">'
        +'<div class="prog-bar-hdr"><span style="color:#AAA">'+ex.name+'</span><span style="color:'+d.color+'">'+v.toLocaleString()+' lbs</span></div>'
        +'<div class="prog-bar-bg"><div class="prog-bar-fill" style="width:'+pct+'%;background:'+d.color+'"></div></div>'
        +'</div>';
    });
    html+='</div>';
  }

  // When to progress
  html+='<div class="guide-box"><div class="guide-title">WHEN TO PROGRESS</div>'
    +[["Add weight","Hit top of rep range all sets for 2 sessions &rarr; +5 lbs upper / +10 lbs lower"],
      ["Add a set","Stuck on weight? 3x10 &rarr; 4x10 before going heavier"],
      ["Slow it down","Stalled? Add 3-4s eccentric &mdash; makes current weight much harder"],
      ["Switch technique","Plateau &rarr; Rest-Pause or Cluster breaks most stalls without adding load"],
      ["Vol flat 3+ weeks","Deload first, then advance to next wave or block"]
    ].map(function(p){return '<div class="guide-row"><span class="guide-term">'+p[0]+'</span><span class="guide-def">'+p[1]+'</span></div>';}).join("")
    +'</div>';

  html+='<div class="export-box"><div class="guide-title">EXPORT FOR CLAUDE</div>'
    +'<div style="font-size:12px;color:var(--muted);line-height:1.6;margin-bottom:10px">Copy your data and paste into Claude for a full coaching breakdown &mdash; trends, plateaus, block progression, next steps.</div>'
    +'<button class="btn-ghost" style="color:var(--muted);border-color:var(--border)" onclick="exportData()">COPY DATA TO CLIPBOARD</button>'
    +'<div id="exportMsg" style="font-size:12px;color:var(--green);margin-top:8px;display:none">Copied &mdash; paste into Claude</div>'
    +'</div>';

  return html;
}

// ── Blocks tab ────────────────────────────────────────────────────────────

function renderBlocks() {
  var cur=getCurrentBlock();
  var html='<div class="info-box">Your training runs on a 12-week macro cycle. Each block aligns with a Juggernaut wave &mdash; the rep range of your main lift and accessories pull in the same direction every block. Advance manually when the tracker shows BLOCK COMPLETE, or when you feel ready.</div>';

  BLOCKS.forEach(function(block) {
    var isActive=block.id===cur;
    html+='<div class="block-card" style="border-color:'+(isActive?block.color+"88":"var(--border)")+(isActive?';background:'+bgFor(block.color,0.04):"")+'"><div class="block-card-hdr">'
      +'<div><div class="block-card-title" style="color:'+block.color+'">'+block.name+(isActive?" &larr; CURRENT":"")+'</div>'
      +'<div class="block-card-sub">'+block.weeks+' &middot; '+block.desc+'</div></div>'
      +(!isActive?'<button class="btn-ghost" style="color:'+block.color+';border-color:'+block.color+'" onclick="setCurrentBlock(\''+block.id+'\');currentEx={};render()">SWITCH</button>':"")
      +'</div>'
      +'<div class="block-main-note"><div class="block-main-mod" style="color:'+block.color+'">'+block.mainMod+'</div><div class="block-main-desc">'+block.mainNote+'</div></div>';

    DAYS.forEach(function(day) {
      var bd=block.days[day.id];
      html+='<div class="block-day-row">'
        +'<span class="block-day-lbl" style="color:'+day.color+'">'+day.label+' '+day.focus+'</span>'
        +'<div class="block-day-detail"><b>'+bd.flavor+'</b> &middot; '+bd.sets+'x'+bd.reps+' &middot; '+bd.pct+' &middot; Rest '+bd.rest
        +'<div class="block-day-note">'+bd.note+'</div></div>'
        +'</div>';
    });
    html+='</div>';
  });

  html+='<div class="info-box" style="margin-top:4px">'
    +'<b style="color:var(--text)">Rep prescriptions:</b><br>'
    +'Compound accessories &mdash; follow the wave (10-12 / 8-10 / 5-7 / 3-5)<br>'
    +'Isolation (laterals, curls, face pulls) &mdash; always 3x12-15<br>'
    +'Golf and core &mdash; always 3x8-10, power intent throughout<br>'
    +'Full body singles &mdash; always 2x10-12, frequency stimulus not overload<br><br>'
    +'<b style="color:var(--text)">Equipment:</b> Power rack &middot; Barbell &middot; Adjustable bench &middot; DBs to 52.5 lbs &middot; Pull-up bar &middot; Dip bars &middot; KBs &middot; Bands &middot; 16lb slam ball &middot; Ab roller'
    +'</div>';

  return html;
}

// ── Defaults tab ──────────────────────────────────────────────────────────

function renderDefaults(d) {
  var defs=getDefaults(activeDay), lib=getLibNames();
  var allNames=[];
  var seen={};
  defs.forEach(function(e){if(!seen[e.name]){seen[e.name]=1;allNames.push(e.name);}});
  lib.forEach(function(n){if(!seen[n]){seen[n]=1;allNames.push(n);}});
  var filtered=defFilter?allNames.filter(function(n){return n.toLowerCase().indexOf(defFilter.toLowerCase())>=0;}):allNames;

  var html='<div class="info-box">Toggle which exercises load automatically each new week. Search to find any exercise in your library.</div>'
    +'<div style="display:flex;gap:8px;margin-bottom:12px">'
    +'<input type="text" id="defSearch" placeholder="Search exercises..." value="'+defFilter+'" oninput="defFilter=this.value;render()" style="flex:1">'
    +'<button class="btn-ghost" style="color:var(--accent);border-color:var(--accent)" onclick="openLib()">+ NEW</button>'
    +'</div>'
    +'<div style="background:var(--surface);border:1px solid var(--border)">'
    +'<div style="padding:10px 14px;border-bottom:1px solid var(--border);font-size:10px;letter-spacing:3px;color:var(--muted)">'
    +d.full.toUpperCase()+' &mdash; '+filtered.length+' exercises'+(defFilter?' <span onclick="defFilter=\'\';render()" style="color:var(--accent);cursor:pointer;margin-left:8px">x clear</span>':"")
    +'</div>';

  if(!filtered.length) {
    html+='<div style="padding:16px 14px;color:var(--muted);font-size:12px">No matches for "'+defFilter+'"</div>';
  } else {
    filtered.forEach(function(name) {
      var isDef=defs.some(function(e){return e.name===name&&e.isDefault;});
      html+='<div class="defaults-item">'
        +'<span class="defaults-name">'+name+'</span>'
        +'<label class="toggle"><input type="checkbox" '+(isDef?"checked":"")+' onchange="toggleDefault(\''+escq(name)+'\',this.checked)"><span class="toggle-slider"></span></label>'
        +'</div>';
    });
  }

  html+='</div>'
    +'<div style="display:flex;gap:8px;margin-top:12px">'
    +'<input type="text" id="quickAddInp" placeholder="Type new exercise and add..." onkeydown="if(event.key===\'Enter\')quickAddDefault()" style="flex:1">'
    +'<button class="btn-ghost" style="color:var(--accent);border-color:var(--accent)" onclick="quickAddDefault()">ADD</button>'
    +'</div>'
    +'<div style="margin-top:12px;font-size:12px;color:var(--muted);line-height:1.7">&#9733; = loads every new week automatically<br>New exercises added here appear in all days</div>';

  return html;
}

// ── Set bar heights after render (for progress bars) ──────────────────────

function fixBarHeights() {
  var bars=document.querySelectorAll("[data-h]");
  for(var i=0;i<bars.length;i++) {
    bars[i].style.height=bars[i].getAttribute("data-h")+"%";
  }
}

// ── Init ──────────────────────────────────────────────────────────────────

render();
// Fix any data-h bars after render
setTimeout(fixBarHeights, 50);

// Re-fix bars after any future render
var origRender=render;
render=function(){origRender();setTimeout(fixBarHeights,50);};

// Initial render
render();
</script>
</body>
</html>
